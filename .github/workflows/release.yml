name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0 or latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite Gating
    uses: ./.github/workflows/test.yml

  release:
    name: Build and Publish Release
    needs: [test]
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Verify Crystal & g++ Toolchain
        run: |
          crystal -v
          g++ --version

      - name: Setup Godot Engine (4.8-dev4)
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: 4.8-dev4
          enable_cache: true

      - name: Configure Godot Executable
        shell: pwsh
        run: |
          Write-Host "Raw GODOT4 env: $env:GODOT4"
          $candidate = $env:GODOT4
          if ($candidate) {
            $candidate = $candidate -replace '^/([a-zA-Z])/', '$1:/'
          }
          if ($candidate -and (Test-Path $candidate)) {
            Copy-Item $candidate ./godot.exe -Force
            Write-Host "Copied $candidate to ./godot.exe"
          } elseif ($env:GODOT4_BIN) {
            $candidate2 = $env:GODOT4_BIN -replace '^/([a-zA-Z])/', '$1:/'
            if (Test-Path $candidate2) {
              Copy-Item $candidate2 ./godot.exe -Force
              Write-Host "Copied $candidate2 to ./godot.exe"
            }
          } elseif (Get-Command godot -ErrorAction SilentlyContinue) {
            $cmd = (Get-Command godot).Source
            Copy-Item $cmd ./godot.exe -Force
            Write-Host "Copied $cmd to ./godot.exe"
          }

          if (-not (Test-Path ./godot.exe)) {
            Write-Host "Fallback: Downloading Godot 4.8-dev4 win64..."
            $zipUrl = "https://github.com/godotengine/godot-builds/releases/download/4.8-dev4/Godot_v4.8-dev4_win64.exe.zip"
            Invoke-WebRequest -Uri $zipUrl -OutFile "godot.zip"
            Expand-Archive -Path "godot.zip" -DestinationPath "godot_temp" -Force
            $foundExe = (Get-ChildItem -Path "godot_temp" -Filter "*_console.exe" -Recurse | Select-Object -First 1).FullName
            if (-not $foundExe) {
              $foundExe = (Get-ChildItem -Path "godot_temp" -Filter "*.exe" -Recurse | Select-Object -First 1).FullName
            }
            Copy-Item $foundExe ./godot.exe -Force
            Remove-Item "godot.zip", "godot_temp" -Recurse -Force
          }

          if (-not (Test-Path ./godot.exe)) {
            Write-Error "Failed to locate or download godot.exe"
            exit 1
          }
          Write-Host "Godot binary verified at ./godot.exe"

      - name: Compute Release Metadata
        id: meta
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag_name }}"
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"

          if ($inputTag -ne "") {
            $tag = $inputTag
            $title = "Release $tag"
          } elseif ($refType -eq "tag") {
            $tag = $refName
            $title = "Release $tag"
          } else {
            $tag = "latest"
            $title = "Latest Build ($refName - ${{ github.sha }})"
          }

          Write-Host "Tag Name: $tag"
          Write-Host "Release Title: $title"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag_name=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_title=$title"

      - name: Compile Release Binaries & Examples
        shell: pwsh
        run: |
          # Build complete project and bridge in release mode
          make all RELEASE=1
          # Build standalone executables for all examples in release mode
          make examples_exe RELEASE=1

      - name: Package Examples Executables (examples.zip)
        shell: pwsh
        run: |
          $examplesDist = "dist/examples_dist"
          if (Test-Path $examplesDist) { Remove-Item $examplesDist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $examplesDist | Out-Null

          # Collect compiled executables for each example
          if (Test-Path "examples") {
            foreach ($ex in Get-ChildItem -Path "examples" -Directory) {
              $exeCandidates = @(
                (Join-Path $ex.FullName "bin/game.exe"),
                (Join-Path $ex.FullName "bin/$($ex.Name).exe")
              )
              $found = $false
              foreach ($cand in $exeCandidates) {
                if (Test-Path $cand) {
                  $dest = Join-Path $examplesDist "$($ex.Name).exe"
                  Copy-Item $cand $dest -Force
                  Write-Host "Packaged example executable: $($ex.Name).exe"
                  $found = $true
                  break
                }
              }
              if (-not $found) {
                Write-Warning "No compiled executable found for example $($ex.Name)"
              }
            }
          }

          # Ensure ONLY .exe files exist in the distribution folder
          Get-ChildItem -Path $examplesDist -File | Where-Object { $_.Extension -ne ".exe" } | Remove-Item -Force

          # Create examples.zip archive
          if (Test-Path "examples.zip") { Remove-Item "examples.zip" -Force }
          Compress-Archive -Path "$examplesDist/*" -DestinationPath "examples.zip" -Force
          Write-Host "Successfully packaged examples.zip containing only compiled executables:"
          Get-ChildItem -Path $examplesDist

      - name: Package Addon/Plugin (godot-crystal-addon.zip)
        shell: pwsh
        run: |
          $addonDist = "dist/addon_dist"
          if (Test-Path $addonDist) { Remove-Item $addonDist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $addonDist | Out-Null

          $addonDest = Join-Path $addonDist "addons/crystal_integration"
          New-Item -ItemType Directory -Force -Path (Split-Path $addonDest) | Out-Null
          Copy-Item -Path "addons/crystal_integration" -Destination (Split-Path $addonDest) -Recurse -Force

          $addonBin = Join-Path $addonDist "bin"
          New-Item -ItemType Directory -Force -Path $addonBin | Out-Null
          if (Test-Path "bin/crystal_bridge.dll") {
            Copy-Item "bin/crystal_bridge.dll" "$addonBin/crystal_bridge.dll" -Force
          }
          foreach ($dll in @('gc.dll', 'iconv-2.dll', 'pcre2-8.dll')) {
            if (Test-Path "bin/$dll") { Copy-Item "bin/$dll" "$addonBin/$dll" -Force }
          }

          if (Test-Path "godot-crystal-addon.zip") { Remove-Item "godot-crystal-addon.zip" -Force }
          Compress-Archive -Path "$addonDist/*" -DestinationPath "godot-crystal-addon.zip" -Force
          Write-Host "Successfully packaged godot-crystal-addon.zip"

      - name: Package Template Project (template-project.zip)
        shell: pwsh
        run: |
          $templateDist = "dist/template_dist"
          if (Test-Path $templateDist) { Remove-Item $templateDist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $templateDist | Out-Null

          Get-ChildItem -Path "template" -Exclude ".godot" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $templateDist -Recurse -Force
          }

          $templateAddon = Join-Path $templateDist "addons/crystal_integration"
          if (-not (Test-Path $templateAddon)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $templateAddon) | Out-Null
            Copy-Item -Path "addons/crystal_integration" -Destination (Split-Path $templateAddon) -Recurse -Force
          }

          $templateBin = Join-Path $templateDist "bin"
          New-Item -ItemType Directory -Force -Path $templateBin | Out-Null
          if (Test-Path "bin/crystal_bridge.dll") {
            Copy-Item "bin/crystal_bridge.dll" "$templateBin/crystal_bridge.dll" -Force
          }
          if (Test-Path "template/bin/game.dll") {
            Copy-Item "template/bin/game.dll" "$templateBin/game.dll" -Force
          }
          foreach ($dll in @('gc.dll', 'iconv-2.dll', 'pcre2-8.dll')) {
            if (Test-Path "bin/$dll") { Copy-Item "bin/$dll" "$templateBin/$dll" -Force }
          }
          Get-ChildItem -Path $templateDist -Include "*.pdb", "*.exp", "*.lib" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          $bundledLib = Join-Path $templateDist "lib/libgodot"
          New-Item -ItemType Directory -Force -Path $bundledLib | Out-Null
          Copy-Item -Path "src" -Destination (Join-Path $bundledLib "src") -Recurse -Force
          Copy-Item "shard.yml" "$bundledLib/shard.yml" -Force
          if (Test-Path "README.md") { Copy-Item "README.md" "$bundledLib/README.md" -Force }

          if (Test-Path "template-project.zip") { Remove-Item "template-project.zip" -Force }
          Compress-Archive -Path "$templateDist/*" -DestinationPath "template-project.zip" -Force
          Write-Host "Successfully packaged template-project.zip"

      - name: Package Core LibGodot Distribution
        shell: pwsh
        run: |
          $libDist = "dist/libgodot_dist"
          if (Test-Path $libDist) { Remove-Item $libDist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $libDist | Out-Null

          # 1. Library bindings source
          Copy-Item -Path "src" -Destination (Join-Path $libDist "src") -Recurse -Force

          # 2. GDExtension editor addon
          Copy-Item -Path "addons" -Destination (Join-Path $libDist "addons") -Recurse -Force

          # 3. Clean starter template
          Copy-Item -Path "template" -Destination (Join-Path $libDist "template") -Recurse -Force

          # 4. Compiled bridge DLL and runtime dependencies
          $binTarget = Join-Path $libDist "bin"
          New-Item -ItemType Directory -Force -Path $binTarget | Out-Null
          if (Test-Path "bin/crystal_bridge.dll") {
            Copy-Item "bin/crystal_bridge.dll" "$binTarget/crystal_bridge.dll" -Force
          }
          foreach ($dll in @('gc.dll', 'iconv-2.dll', 'pcre2-8.dll', 'libgodot.dll')) {
            if (Test-Path "bin/$dll") {
              Copy-Item "bin/$dll" "$binTarget/$dll" -Force
            }
          }

          # 5. Metadata and documentation
          Copy-Item "shard.yml" "$libDist/shard.yml" -Force
          Copy-Item "README.md" "$libDist/README.md" -Force
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$libDist/LICENSE" -Force }

          # Determine release tag name
          $tag = "${{ steps.meta.outputs.tag_name }}"
          $archiveName = "libgodot-crystal-windows-x86_64-$tag.zip"
          if (Test-Path $archiveName) { Remove-Item $archiveName -Force }
          Compress-Archive -Path "$libDist/*" -DestinationPath $archiveName -Force
          Write-Host "Generated core release archive: $archiveName"
          Add-Content -Path $env:GITHUB_ENV -Value "CORE_ARCHIVE=$archiveName"

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 "examples.zip", "godot-crystal-addon.zip", "template-project.zip", "$env:CORE_ARCHIVE" | Format-Table -AutoSize | Out-String | Set-Content "checksums.txt"
          Get-Content "checksums.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          files: |
            examples.zip
            godot-crystal-addon.zip
            template-project.zip
            ${{ env.CORE_ARCHIVE }}
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

