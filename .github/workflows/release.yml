name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0 or latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  init-release:
    name: Initialize Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_title: ${{ steps.meta.outputs.release_title }}

    steps:
      - name: Compute Release Metadata
        id: meta
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            TITLE="Release $TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            TITLE="Release $TAG"
          else
            TAG="latest"
            TITLE="Latest Build ($REF_NAME - ${{ github.sha }})"
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build & Release Windows (x86_64)
    needs: [init-release]
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Verify Crystal & g++ Toolchain
        run: |
          crystal -v
          g++ --version

      - name: Setup Godot Engine (4.8-dev4)
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: 4.8-dev4
          enable_cache: true

      - name: Configure Godot Executable
        shell: pwsh
        run: |
          $candidate = $env:GODOT4
          if ($candidate) {
            $candidate = $candidate -replace '^/([a-zA-Z])/', '$1:/'
            $mainCand = $candidate -replace '(_console|\.console)\.exe$', '.exe'
            if (Test-Path $mainCand) {
              $candidate = $mainCand
            }
          }
          if ($candidate -and (Test-Path $candidate)) {
            Copy-Item $candidate ./godot.exe -Force
          } elseif ($env:GODOT4_BIN) {
            $candidate2 = $env:GODOT4_BIN -replace '^/([a-zA-Z])/', '$1:/'
            $mainCand2 = $candidate2 -replace '(_console|\.console)\.exe$', '.exe'
            if (Test-Path $mainCand2) {
              $candidate2 = $mainCand2
            }
            if (Test-Path $candidate2) {
              Copy-Item $candidate2 ./godot.exe -Force
            }
          } elseif (Get-Command godot -ErrorAction SilentlyContinue) {
            $cmd = (Get-Command godot).Source
            $mainCmd = $cmd -replace '(_console|\.console)\.exe$', '.exe'
            if (Test-Path $mainCmd) { $cmd = $mainCmd }
            Copy-Item $cmd ./godot.exe -Force
          }

          if (-not (Test-Path ./godot.exe) -or ((Get-Item ./godot.exe).Length -lt 1000000)) {
            $zipUrl = "https://github.com/godotengine/godot-builds/releases/download/4.8-dev4/Godot_v4.8-dev4_win64.exe.zip"
            Invoke-WebRequest -Uri $zipUrl -OutFile "godot.zip"
            Expand-Archive -Path "godot.zip" -DestinationPath "godot_temp" -Force
            $foundExe = (Get-ChildItem -Path "godot_temp" -Filter "*.exe" -Recurse | Where-Object { $_.Name -notlike "*_console*" -and $_.Name -notlike "*.console*" } | Select-Object -First 1).FullName
            if (-not $foundExe) {
              $foundExe = (Get-ChildItem -Path "godot_temp" -Filter "*.exe" -Recurse | Select-Object -First 1).FullName
            }
            Copy-Item $foundExe ./godot.exe -Force
            Remove-Item "godot.zip", "godot_temp" -Recurse -Force
          }

      - name: Ensure Godot Export Templates
        shell: pwsh
        run: |
          $winBin = "bin/windows"
          if (-not (Test-Path $winBin)) { New-Item -ItemType Directory -Force -Path $winBin | Out-Null }
          & pwsh -NoProfile -File scripts/ensure_export_templates.ps1 -PackageZip -ZipOutput "$winBin/godot-crystal-export-templates-4.8-dev4.zip"

      - name: Compile Release Binaries & Run Test Suite
        shell: pwsh
        run: |
          make all RELEASE=1

      - name: Upload Test Status Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-report-windows
          path: |
            test/test_report.md
            test/test_report.json
            test/.runtime_test_results.txt
            test/.tool_tests_passed
            test/.tool_tests_failed
            test/.runtime_tests_passed
            test/.runtime_tests_failed
          if-no-files-found: ignore

      - name: Package Windows Examples (examples-windows-x86_64.zip)
        shell: pwsh
        run: |
          $examplesDir = "bin/windows/examples"
          if (Test-Path $examplesDir) { Remove-Item $examplesDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $examplesDir | Out-Null

          if (Test-Path "examples") {
            foreach ($ex in Get-ChildItem -Path "examples" -Directory) {
              Write-Host "Packaging standalone playable example for $($ex.Name)..." -ForegroundColor Cyan
              & pwsh -NoProfile -File scripts/package_game.ps1 -ProjectPath $ex.FullName -Name $ex.Name -TargetDir $examplesDir -Release 1
            }
          }

          Get-ChildItem -Path $examplesDir -Filter "*_loaded_*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$examplesDir/*" -DestinationPath "bin/windows/examples-windows-x86_64.zip" -Force

      - name: Package Windows Core LibGodot Distribution
        shell: pwsh
        run: |
          $libDir = "bin/windows/libgodot_windows"
          if (Test-Path $libDir) { Remove-Item $libDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null

          Copy-Item -Path "src" -Destination (Join-Path $libDir "src") -Recurse -Force
          Copy-Item -Path "addons" -Destination (Join-Path $libDir "addons") -Recurse -Force
          Copy-Item -Path "template" -Destination (Join-Path $libDir "template") -Recurse -Force

          $binTarget = Join-Path $libDir "bin"
          New-Item -ItemType Directory -Force -Path $binTarget | Out-Null
          if (Test-Path "bin/crystal_bridge.dll") {
            Copy-Item "bin/crystal_bridge.dll" "$binTarget/crystal_bridge.dll" -Force
          }
          foreach ($dll in @('gc.dll', 'iconv-2.dll', 'pcre2-8.dll', 'libgodot.dll')) {
            if (Test-Path "bin/$dll") {
              Copy-Item "bin/$dll" "$binTarget/$dll" -Force
            }
          }

          Copy-Item "shard.yml" "$libDir/shard.yml" -Force
          Copy-Item "README.md" "$libDir/README.md" -Force
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$libDir/LICENSE" -Force }

          $tag = "${{ needs.init-release.outputs.tag_name }}"
          $archiveName = "bin/windows/libgodot-crystal-windows-x86_64-$tag.zip"
          Compress-Archive -Path "$libDir/*" -DestinationPath $archiveName -Force

      - name: Collect Windows Staging Artifacts
        shell: pwsh
        run: |
          $winBin = "bin/windows"
          if (-not (Test-Path $winBin)) { New-Item -ItemType Directory -Force -Path $winBin | Out-Null }
          if (Test-Path "bin/crystal_bridge.dll") { Copy-Item "bin/crystal_bridge.dll" "$winBin/" -Force }
          if (Test-Path "template/bin/game.dll") { Copy-Item "template/bin/game.dll" "$winBin/" -Force }
          foreach ($dll in @('gc.dll', 'iconv-2.dll', 'pcre2-8.dll', 'libgodot.dll')) {
            if (Test-Path "bin/$dll") { Copy-Item "bin/$dll" "$winBin/" -Force }
          }

      - name: Publish Windows Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release.outputs.tag_name }}
          name: ${{ needs.init-release.outputs.release_title }}
          files: |
            bin/windows/examples-windows-x86_64.zip
            bin/windows/libgodot-crystal-windows-x86_64-${{ needs.init-release.outputs.tag_name }}.zip
            bin/windows/godot-crystal-export-templates-4.8-dev4.zip
          fail_on_unmatched_files: false

      - name: Upload Windows Staging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-artifacts
          path: bin/windows/

  build-linux:
    name: Build & Release Linux (x86_64)
    needs: [init-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Verify Crystal & Toolchain
        run: |
          crystal -v
          g++ --version
          ld.lld --version

      - name: Setup Godot Engine (4.8-dev4)
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: 4.8-dev4
          enable_cache: true

      - name: Configure Godot Executable
        shell: bash
        run: |
          if [ -n "$GODOT4" ] && [ -f "$GODOT4" ]; then
            cp "$GODOT4" ./godot
            chmod +x ./godot
          elif [ -n "$GODOT4_BIN" ] && [ -f "$GODOT4_BIN" ]; then
            cp "$GODOT4_BIN" ./godot
            chmod +x ./godot
          elif command -v godot >/dev/null 2>&1; then
            cp "$(command -v godot)" ./godot
            chmod +x ./godot
          else
            wget -q https://github.com/godotengine/godot-builds/releases/download/4.8-dev4/Godot_v4.8-dev4_linux.x86_64.zip -O godot.zip
            unzip -q godot.zip
            mv Godot_v4.8-dev4_linux.x86_64 ./godot
            chmod +x ./godot
            rm godot.zip
          fi
          ./godot --version

      - name: Ensure Godot Export Templates
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/ensure_export_templates.ps1

      - name: Compile Release Binaries & Run Test Suite
        shell: bash
        run: |
          make all RELEASE=1

      - name: Upload Test Status Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-report-linux
          path: |
            test/test_report.md
            test/test_report.json
            test/.runtime_test_results.txt
            test/.tool_tests_passed
            test/.tool_tests_failed
            test/.runtime_tests_passed
            test/.runtime_tests_failed
          if-no-files-found: ignore

      - name: Package Linux Examples (examples-linux-x86_64.zip)
        shell: pwsh
        run: |
          $examplesDir = "bin/linux/examples"
          if (Test-Path $examplesDir) { Remove-Item $examplesDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $examplesDir | Out-Null

          if (Test-Path "examples") {
            foreach ($ex in Get-ChildItem -Path "examples" -Directory) {
              Write-Host "Packaging standalone playable Linux example for $($ex.Name)..." -ForegroundColor Cyan
              & pwsh -NoProfile -File scripts/package_game.ps1 -ProjectPath $ex.FullName -Name $ex.Name -TargetDir $examplesDir -Release 1
            }
          }

          Get-ChildItem -Path $examplesDir -Filter "*_loaded_*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$examplesDir/*" -DestinationPath "bin/linux/examples-linux-x86_64.zip" -Force

      - name: Package Linux Core LibGodot Distribution
        shell: bash
        run: |
          ROOT_DIR="$(pwd)"
          LIB_DIR="$ROOT_DIR/bin/linux/libgodot_linux"
          rm -rf "$LIB_DIR"
          mkdir -p "$LIB_DIR/bin"

          cp -r src "$LIB_DIR/"
          cp -r addons "$LIB_DIR/"
          cp -r template "$LIB_DIR/"
          if [ -f "bin/crystal_bridge.so" ]; then
            cp "bin/crystal_bridge.so" "$LIB_DIR/bin/"
          fi
          if [ -f "bin/libgodot.so" ]; then
            cp "bin/libgodot.so" "$LIB_DIR/bin/"
          fi

          cp shard.yml "$LIB_DIR/"
          cp README.md "$LIB_DIR/"
          [ -f LICENSE ] && cp LICENSE "$LIB_DIR/"

          TAG="${{ needs.init-release.outputs.tag_name }}"
          ARCHIVE_PATH="$ROOT_DIR/bin/linux/libgodot-crystal-linux-x86_64-$TAG.zip"
          (cd "$LIB_DIR" && zip -r "$ARCHIVE_PATH" ./*)

      - name: Collect Linux Staging Artifacts
        shell: bash
        run: |
          LINUX_BIN="bin/linux"
          mkdir -p "$LINUX_BIN"

          if [ -f "bin/crystal_bridge.so" ]; then cp "bin/crystal_bridge.so" "$LINUX_BIN/"; fi
          if [ -f "template/bin/game.so" ]; then cp "template/bin/game.so" "$LINUX_BIN/"; fi
          if [ -f "bin/libgodot.so" ]; then cp "bin/libgodot.so" "$LINUX_BIN/"; fi

      - name: Publish Linux Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release.outputs.tag_name }}
          name: ${{ needs.init-release.outputs.release_title }}
          files: |
            bin/linux/examples-linux-x86_64.zip
            bin/linux/libgodot-crystal-linux-x86_64-${{ needs.init-release.outputs.tag_name }}.zip
          fail_on_unmatched_files: false

      - name: Upload Linux Staging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-artifacts
          path: bin/linux/

  build-android:
    name: Build & Release Android (arm64-v8a)
    needs: [init-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Setup Java (for apksigner & keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Godot Engine (4.8-dev4)
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: 4.8-dev4
          enable_cache: true

      - name: Configure Godot & Android SDK Environment
        shell: bash
        run: |
          if [ -n "$GODOT4" ] && [ -f "$GODOT4" ]; then
            cp "$GODOT4" ./godot
            chmod +x ./godot
          elif [ -n "$GODOT4_BIN" ] && [ -f "$GODOT4_BIN" ]; then
            cp "$GODOT4_BIN" ./godot
            chmod +x ./godot
          elif command -v godot >/dev/null 2>&1; then
            cp "$(command -v godot)" ./godot
            chmod +x ./godot
          else
            echo "Fallback: Downloading Godot 4.8-dev4 linux.x86_64..."
            wget -q https://github.com/godotengine/godot-builds/releases/download/4.8-dev4/Godot_v4.8-dev4_linux.x86_64.zip -O godot.zip
            unzip -q godot.zip
            mv Godot_v4.8-dev4_linux.x86_64 ./godot
            chmod +x ./godot
            rm godot.zip
          fi
          ./godot --version

          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi

          if [ -d "$ANDROID_HOME/cmake" ]; then
            first_cmake=$(ls -1 "$ANDROID_HOME/cmake" 2>/dev/null | head -n 1)
            if [ -n "$first_cmake" ] && [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
              ln -s "$ANDROID_HOME/cmake/$first_cmake" "$ANDROID_HOME/cmake/3.22.1" || true
            fi
          fi

      - name: Ensure Godot Export Templates
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/ensure_export_templates.ps1

      - name: Compile Release Binaries & Template APK
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/package_android.ps1 -ProjectPath template -Name template -Release

      - name: Package Android Examples to APKs
        shell: pwsh
        run: |
          if (Test-Path "examples") {
            foreach ($ex in Get-ChildItem -Path "examples" -Directory) {
              Write-Host "Packaging Android APK for $($ex.Name)..." -ForegroundColor Cyan
              & pwsh -NoProfile -File scripts/package_android.ps1 -ProjectPath $ex.FullName -Name $ex.Name -Release
            }
          }

          Compress-Archive -Path "bin/android/*.apk" -DestinationPath "bin/android/examples-android-arm64.zip" -Force

      - name: Generate Android Status Report
        if: always()
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/report_android.ps1

      - name: Upload Android Status Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-status-report-android
          path: |
            bin/android/test_report.md
            bin/android/test_report.json
            bin/android/android_audit_report.txt
          if-no-files-found: ignore

      - name: Publish Android Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release.outputs.tag_name }}
          name: ${{ needs.init-release.outputs.release_title }}
          files: |
            bin/android/examples-android-arm64.zip
            bin/android/*.apk
          fail_on_unmatched_files: false

      - name: Upload Android Staging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android-artifacts
          path: bin/android/

  finalize-release:
    name: Finalize Universal Packages & Release Notes
    needs: [init-release, build-windows, build-linux, build-android]
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-windows-artifacts
          path: staging/windows

      - name: Download Linux Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-linux-artifacts
          path: staging/linux

      - name: Download Android Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-android-artifacts
          path: staging/android

      - name: Package Universal Addon (godot-crystal-addon.zip)
        shell: bash
        run: |
          ROOT_DIR="$(pwd)"
          ADDON_DIST="$ROOT_DIR/bin/addon_dist"
          rm -rf "$ADDON_DIST"
          mkdir -p "$ADDON_DIST/addons"
          mkdir -p "$ADDON_DIST/bin"

          cp -r addons/crystal_integration "$ADDON_DIST/addons/"

          # Locate Windows DLLs
          WIN_DIR="staging/windows"
          [ -d "staging/windows/bin" ] && WIN_DIR="staging/windows/bin"
          if [ -f "$WIN_DIR/crystal_bridge.dll" ]; then
            cp "$WIN_DIR/crystal_bridge.dll" "$ADDON_DIST/bin/"
            for dll in gc.dll iconv-2.dll pcre2-8.dll libgodot.dll; do
              [ -f "$WIN_DIR/$dll" ] && cp "$WIN_DIR/$dll" "$ADDON_DIST/bin/"
            done
          fi

          # Locate Linux shared objects
          LINUX_DIR="staging/linux"
          [ -d "staging/linux/bin" ] && LINUX_DIR="staging/linux/bin"
          if [ -f "$LINUX_DIR/crystal_bridge.so" ]; then
            cp "$LINUX_DIR/crystal_bridge.so" "$ADDON_DIST/bin/"
            [ -f "$LINUX_DIR/libgodot.so" ] && cp "$LINUX_DIR/libgodot.so" "$ADDON_DIST/bin/"
          fi

          # Locate Android shared objects
          ANDROID_ARM="staging/android/arm64-v8a"
          [ -d "staging/android/bin/android/arm64-v8a" ] && ANDROID_ARM="staging/android/bin/android/arm64-v8a"
          if [ -d "$ANDROID_ARM" ]; then
            mkdir -p "$ADDON_DIST/bin/android/arm64-v8a"
            cp -r "$ANDROID_ARM"/* "$ADDON_DIST/bin/android/arm64-v8a/"
          fi

          (cd "$ADDON_DIST" && zip -r "$ROOT_DIR/bin/godot-crystal-addon.zip" ./*)

      - name: Package Universal Starter Template (template-project.zip)
        shell: bash
        run: |
          ROOT_DIR="$(pwd)"
          TEMPLATE_DIST="$ROOT_DIR/bin/template_dist"
          rm -rf "$TEMPLATE_DIST"
          mkdir -p "$TEMPLATE_DIST/bin"

          cp -r template/. "$TEMPLATE_DIST/"
          rm -rf "$TEMPLATE_DIST/.godot" "$TEMPLATE_DIST/bin"
          mkdir -p "$TEMPLATE_DIST/bin"

          if [ ! -d "$TEMPLATE_DIST/addons/crystal_integration" ]; then
            mkdir -p "$TEMPLATE_DIST/addons"
            cp -r addons/crystal_integration "$TEMPLATE_DIST/addons/"
          fi

          # Bundle Windows binaries if available
          WIN_DIR="staging/windows"
          [ -d "staging/windows/bin" ] && WIN_DIR="staging/windows/bin"
          if [ -f "$WIN_DIR/crystal_bridge.dll" ]; then
            cp "$WIN_DIR/crystal_bridge.dll" "$TEMPLATE_DIST/bin/"
            [ -f "$WIN_DIR/game.dll" ] && cp "$WIN_DIR/game.dll" "$TEMPLATE_DIST/bin/"
            for dll in gc.dll iconv-2.dll pcre2-8.dll libgodot.dll; do
              [ -f "$WIN_DIR/$dll" ] && cp "$WIN_DIR/$dll" "$TEMPLATE_DIST/bin/"
            done
          fi

          # Bundle Linux binaries if available
          LINUX_DIR="staging/linux"
          [ -d "staging/linux/bin" ] && LINUX_DIR="staging/linux/bin"
          if [ -f "$LINUX_DIR/crystal_bridge.so" ]; then
            cp "$LINUX_DIR/crystal_bridge.so" "$TEMPLATE_DIST/bin/"
            [ -f "$LINUX_DIR/game.so" ] && cp "$LINUX_DIR/game.so" "$TEMPLATE_DIST/bin/"
            [ -f "$LINUX_DIR/libgodot.so" ] && cp "$LINUX_DIR/libgodot.so" "$TEMPLATE_DIST/bin/"
          fi

          # Bundle Android binaries if available
          ANDROID_ARM="staging/android/arm64-v8a"
          [ -d "staging/android/bin/android/arm64-v8a" ] && ANDROID_ARM="staging/android/bin/android/arm64-v8a"
          if [ -d "$ANDROID_ARM" ]; then
            mkdir -p "$TEMPLATE_DIST/bin/android/arm64-v8a"
            cp -r "$ANDROID_ARM"/* "$TEMPLATE_DIST/bin/android/arm64-v8a/"
          fi

          mkdir -p "$TEMPLATE_DIST/lib/libgodot"
          cp -r src "$TEMPLATE_DIST/lib/libgodot/"
          cp shard.yml "$TEMPLATE_DIST/lib/libgodot/"
          [ -f README.md ] && cp README.md "$TEMPLATE_DIST/lib/libgodot/"

          (cd "$TEMPLATE_DIST" && zip -r "$ROOT_DIR/bin/template-project.zip" ./*)

      - name: Prepare Final Universal Assets & Checksums
        shell: bash
        run: |
          ROOT_DIR="$(pwd)"
          mkdir -p "$ROOT_DIR/bin/release_assets"
          TAG="${{ needs.init-release.outputs.tag_name }}"

          [ -f "$ROOT_DIR/bin/godot-crystal-addon.zip" ] && cp "$ROOT_DIR/bin/godot-crystal-addon.zip" "$ROOT_DIR/bin/release_assets/"
          [ -f "$ROOT_DIR/bin/template-project.zip" ] && cp "$ROOT_DIR/bin/template-project.zip" "$ROOT_DIR/bin/release_assets/"

          (cd "$ROOT_DIR/bin/release_assets" && sha256sum *.zip > checksums.txt && cat checksums.txt)

      - name: Generate Descriptive Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ needs.init-release.outputs.tag_name }}"
          cat << 'EOF' > release_body.md
          ## LibGodot Crystal Release Notes

          ### 📦 Addon & Starter Template
          - **`godot-crystal-addon.zip`**:
            The official Godot editor addon (`addons/crystal_integration`) with pre-compiled GDExtension loader bridge binaries for **Windows** (`crystal_bridge.dll`), **Linux** (`crystal_bridge.so`), and **Android** (`arm64-v8a/libcrystal_bridge.so`). Drop the `addons/` folder directly into your existing Godot 4.8+ project to enable Crystal node authoring, inspector properties, and hot-reload.
          - **`template-project.zip`**:
            A clean, ready-to-use Godot project skeleton powered by Crystal. Contains pre-configured scenes, sample 3D nodes (`src/main.cr`), automated specifications (`spec/main_spec.cr`), GDExtension configuration, Android export presets, and pre-wired **GitHub Actions CI/CD workflows** (`.github/workflows/`) for automated testing (`crystal spec`) and multi-platform release deployment (Windows, Linux, and Android).

          ### 🛠️ Export Templates
          - **`godot-crystal-export-templates-4.8-dev4.zip`**:
            Official Godot 4.8-dev4 export templates package ready for Crystal standalone game project distribution.

          ### 📦 Standalone Toolchain Distributions
          - **`libgodot-crystal-windows-x86_64.zip`**:
            Complete LibGodot Crystal package for **Windows (x86_64)**. Contains the full Crystal bindings library source (`src/`), GDExtension bridge DLL (`crystal_bridge.dll`), and Windows runtime dependencies (`libgodot.dll`, `gc.dll`, `iconv-2.dll`, `pcre2-8.dll`).
          - **`libgodot-crystal-linux-x86_64.zip`**:
            Complete LibGodot Crystal package for **Linux (x86_64)**. Contains the full Crystal bindings library source (`src/`), GDExtension bridge shared object (`crystal_bridge.so`), and Linux GDExtension configurations for native Linux exports and development.

          ### 🎮 Pre-Compiled Example Games & Standalone APKs
          - **`basic_demo.apk`**:
            Standalone installable Android APK for the `basic_demo` 3D showcase game. Built for `arm64-v8a` devices (Android 10+ / API 29+) with statically embedded Boehm GC, PCRE2, and Crystal runtime. Ready to install via `adb install -r basic_demo.apk`.
          - **`examples-android-arm64.zip`**:
            Collection of all pre-compiled example game APKs packaged for Android (`arm64-v8a`).
          - **`examples-windows-x86_64.zip`**:
            Standalone compiled game executables for all examples on **Windows (x86_64)**, bundled with all required runtime DLLs (`libgodot.dll`, `crystal_bridge.dll`, `gc.dll`, `iconv-2.dll`, `pcre2-8.dll`). Ready to extract and run immediately without needing compiler setup.
          - **`examples-linux-x86_64.zip`**:
            Standalone compiled game executables and shared libraries for all examples on **Linux (x86_64)**. Ready to extract and execute on Linux distributions.

          ### 🔒 Integrity
          - **`checksums.txt`**:
            SHA-256 cryptographic hashes for each release archive to verify download integrity.
          EOF

      - name: Publish Universal Assets & Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release.outputs.tag_name }}
          name: ${{ needs.init-release.outputs.release_title }}
          body_path: release_body.md
          files: |
            bin/release_assets/godot-crystal-addon.zip
            bin/release_assets/template-project.zip
            bin/release_assets/checksums.txt
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
