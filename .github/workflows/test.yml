name: Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Run Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Verify Crystal & g++ Toolchain
        run: |
          crystal -v
          g++ --version

      - name: Setup Godot Engine (4.8-dev4)
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: 4.8-dev4
          enable_cache: true

      - name: Configure Godot Executable
        shell: pwsh
        run: |
          Write-Host "Raw GODOT4 env: $env:GODOT4"
          $candidate = $env:GODOT4
          if ($candidate) {
            $candidate = $candidate -replace '^/([a-zA-Z])/', '$1:/'
          }
          if ($candidate -and (Test-Path $candidate)) {
            Copy-Item $candidate ./godot.exe -Force
            Write-Host "Copied $candidate to ./godot.exe"
          } elseif ($env:GODOT4_BIN) {
            $candidate2 = $env:GODOT4_BIN -replace '^/([a-zA-Z])/', '$1:/'
            if (Test-Path $candidate2) {
              Copy-Item $candidate2 ./godot.exe -Force
              Write-Host "Copied $candidate2 to ./godot.exe"
            }
          } elseif (Get-Command godot -ErrorAction SilentlyContinue) {
            $cmd = (Get-Command godot).Source
            Copy-Item $cmd ./godot.exe -Force
            Write-Host "Copied $cmd to ./godot.exe"
          }

          if (-not (Test-Path ./godot.exe)) {
            Write-Host "Fallback: Downloading Godot 4.8-dev4 win64..."
            $zipUrl = "https://github.com/godotengine/godot-builds/releases/download/4.8-dev4/Godot_v4.8-dev4_win64.exe.zip"
            Invoke-WebRequest -Uri $zipUrl -OutFile "godot.zip"
            Expand-Archive -Path "godot.zip" -DestinationPath "godot_temp" -Force
            $foundExe = (Get-ChildItem -Path "godot_temp" -Filter "*_console.exe" -Recurse | Select-Object -First 1).FullName
            if (-not $foundExe) {
              $foundExe = (Get-ChildItem -Path "godot_temp" -Filter "*.exe" -Recurse | Select-Object -First 1).FullName
            }
            Copy-Item $foundExe ./godot.exe -Force
            Remove-Item "godot.zip", "godot_temp" -Recurse -Force
          }

          if (-not (Test-Path ./godot.exe)) {
            Write-Error "Failed to locate or download godot.exe"
            exit 1
          }
          Write-Host "Godot binary verified at ./godot.exe"

      - name: Build and Run LibGodot Test Suite
        shell: pwsh
        run: |
          # Per AGENTS.md, agents and CI must execute 'make all'
          make all

      - name: Upload Test Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            test/.runtime_test_results.txt
            test/.tool_tests_passed
            test/.tool_tests_failed
            test/.runtime_tests_passed
            test/.runtime_tests_failed
          if-no-files-found: ignore

  test-linux:
    name: Run Test Suite (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Verify Crystal & Toolchain
        run: |
          crystal -v
          g++ --version
          lld --version

      - name: Setup Godot Engine (4.8-dev4)
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: 4.8-dev4
          enable_cache: true

      - name: Configure Godot Executable
        shell: bash
        run: |
          if [ -n "$GODOT4" ] && [ -f "$GODOT4" ]; then
            cp "$GODOT4" ./godot
            chmod +x ./godot
          elif [ -n "$GODOT4_BIN" ] && [ -f "$GODOT4_BIN" ]; then
            cp "$GODOT4_BIN" ./godot
            chmod +x ./godot
          elif command -v godot >/dev/null 2>&1; then
            cp "$(command -v godot)" ./godot
            chmod +x ./godot
          else
            echo "Fallback: Downloading Godot 4.8-dev4 linux.x86_64..."
            wget -q https://github.com/godotengine/godot-builds/releases/download/4.8-dev4/Godot_v4.8-dev4_linux.x86_64.zip -O godot.zip
            unzip -q godot.zip
            mv Godot_v4.8-dev4_linux.x86_64 ./godot
            chmod +x ./godot
            rm godot.zip
          fi
          ./godot --version

      - name: Build and Run LibGodot Test Suite
        shell: bash
        run: |
          make all

      - name: Upload Test Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            test/.runtime_test_results.txt
            test/.tool_tests_passed
            test/.tool_tests_failed
            test/.runtime_tests_passed
            test/.runtime_tests_failed
          if-no-files-found: ignore
