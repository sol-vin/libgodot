name: Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Run Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Verify Crystal & g++ Toolchain
        run: |
          crystal -v
          g++ --version

      - name: Setup Godot Engine (4.8-dev4)
        uses: appsinacup/action_setup_godot@v2
        with:
          repo: godotengine/godot-builds
          version: 4.8-dev4
          enable_cache: true

      - name: Configure Godot Executable
        shell: pwsh
        run: |
          Write-Host "Resolved GODOT4 path: $env:GODOT4"
          if ($env:GODOT4 -and (Test-Path $env:GODOT4)) {
            Copy-Item $env:GODOT4 ./godot.exe -Force
            Write-Host "Copied $env:GODOT4 to ./godot.exe"
          } elseif (Get-Command godot -ErrorAction SilentlyContinue) {
            $cmd = (Get-Command godot).Source
            Copy-Item $cmd ./godot.exe -Force
            Write-Host "Copied $cmd to ./godot.exe"
          } else {
            Write-Error "Could not locate Godot executable from action_setup_godot."
            exit 1
          }

      - name: Build and Run LibGodot Test Suite
        shell: pwsh
        run: |
          # Per AGENTS.md, agents and CI must execute 'make all'
          make all

      - name: Upload Test Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/.runtime_test_results.txt
            test/.tool_tests_passed
            test/.tool_tests_failed
            test/.runtime_tests_passed
            test/.runtime_tests_failed
          if-no-files-found: ignore
